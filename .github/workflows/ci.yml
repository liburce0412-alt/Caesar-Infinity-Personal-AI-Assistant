name: Verify

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
      - name: Create ephemeral debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - run: bash ./gradlew :apps:android:app:testDebugUnitTest :apps:android:app:assembleDebug :apps:android:app:lintDebug --stacktrace
      - shell: pwsh
        run: ./scripts/verify-local-ai-package.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: campusai-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: admin-visual-evidence
          path: apps/admin/test-results

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-chat/index.ts supabase/functions/ai-chat/protocol_test.ts
      - run: deno test supabase/functions/ai-chat/protocol_test.ts
      - run: npx supabase@2.115.0 start -x studio,imgproxy,logflare,vector
      - run: npx supabase@2.115.0 db reset --local
      - run: npx supabase@2.115.0 db lint --local --level warning
      - if: always()
        run: npx supabase@2.115.0 stop --no-backup

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject client-side provider secrets
        shell: bash
        run: |
          if rg -n 'DEEPSEEK_API_KEY=.{8}|service_role[_-]?(key)?=.{8}|GEMINI_API_KEY=.{8}' --glob '!**/.env.example' .; then
            echo 'Provider or service-role secret pattern found in client-accessible source.'
            exit 1
          fi
