name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Create ephemeral debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Require release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL must use HTTPS."
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" == *replace-with* || "$SUPABASE_ANON_KEY" == *your_anon* || "$SUPABASE_ANON_KEY" == *placeholder* ]]; then
            echo "::error::SUPABASE_ANON_KEY is still a placeholder."
            exit 1
          fi

      - name: Restore public Supabase client configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env

      - name: Verify release source
        shell: bash
        run: bash ./gradlew :apps:android:app:testDebugUnitTest --stacktrace

      - name: Restore signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caesar-release.jks"

      - name: Build signed applications
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/caesar-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}" \
          bash ./gradlew \
            :apps:android:app:assembleRelease \
            :apps:android:app:lintRelease \
            --stacktrace

      - name: Verify packaged client configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          apk='apps/android/app/build/outputs/apk/release/app-release.apk'
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/caesar-classes.dex"
          grep -aFq "$SUPABASE_URL" "$RUNNER_TEMP/caesar-classes.dex" || {
            echo "::error::Signed APK does not contain the configured Supabase URL."
            exit 1
          }
          grep -aFq "$SUPABASE_ANON_KEY" "$RUNNER_TEMP/caesar-classes.dex" || {
            echo "::error::Signed APK does not contain the configured Supabase client key."
            exit 1
          }
          rm -f "$RUNNER_TEMP/caesar-classes.dex"

      - name: Stage signed artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/caesar-${RELEASE_TAG}.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Publish signed release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Caesar∞ ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove restored client configuration
        if: always()
        shell: bash
        run: rm -f .env "$RUNNER_TEMP/caesar-classes.dex"
