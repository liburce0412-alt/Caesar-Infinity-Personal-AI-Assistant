name: Admin Checks

on:
  push:
    branches: [main]
    paths: ['apps/admin/**', '.github/workflows/deploy-admin.yml']
  pull_request:
    paths: ['apps/admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Production is deployed to the Alibaba ECS after HTTPS verification.
