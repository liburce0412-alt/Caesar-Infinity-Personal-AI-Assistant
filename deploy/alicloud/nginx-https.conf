map $http_upgrade $campusai_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name campusai.campus3ai.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/campusai-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name campusai.campus3ai.xyz;
    ssl_certificate /etc/letsencrypt/live/campusai.campus3ai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusai.campus3ai.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    root /var/www/campusai-admin;
    index index.html;
    location ~ ^/(auth|rest|storage|realtime)/v1(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campusai_connection;
        proxy_read_timeout 300s;
    }
    # Studio, metadata and database administration remain behind SSH.
    location ^~ /pg/ { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.map$ { return 404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
